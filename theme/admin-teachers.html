<!DOCTYPE html>
<html lang="zxx">

<head>
  <meta charset="utf-8">
  <title>Manage Teachers - Admin - Lecture Flow</title>

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <!-- ** Plugins Needed for the Project ** -->
  <!-- Bootstrap -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <!-- themefy-icon -->
  <link rel="stylesheet" href="plugins/themify-icons/themify-icons.css">
  <!-- Main Stylesheet -->
  <link href="css/style.css" rel="stylesheet">

  <!--Favicon-->
  <link rel="icon" type="image/png" sizes="32x32" href="images/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon.png">

</head>

<body>

  <!-- navigation -->
  <section class="fixed-top navigation">
    <div class="">
      <nav class="navbar navbar-expand-lg navbar-light" role="navigation">
        <a class="navbar-brand" href="admin-dashboard.html">
          <h3> Lecture flow </h3>
        </a>
        <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navbar"
          aria-controls="navbar" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse text-center" id="navbar">
          <ul class="navbar-nav mx-auto">
            <li class="nav-item">
              <a class="nav-link" href="admin-dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin-students.html">Students</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin-teachers.html">Teachers</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin-podcasts.html">Podcasts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin-transcripts.html">Transcripts</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="admin-audios.html">Audios</a>
            </li>
          </ul>
        </div>
        <div class="ml-auto d-flex">
          <a href="admin-dashboard.html" class="btn btn-primary ml-lg-3 primary-shadow">Dashboard</a>
          <a href="login .html" class="btn btn-primary ml-lg-3 primary-shadow" onclick="logout()">Logout</a>
        </div>
    </div>
    </nav>
    </div>
  </section>

  <!-- team -->
  <section class="section-lg team py-5" id="team" style="margin-top: 80px; margin-bottom: 0; padding-bottom: 0;">
    <div class="container-fluid">
      <div class="col-lg-12 text-center">
        <h1 class="section-title mb-1" style="font-family: 'Times New Roman', Times, serif;">Manage Teachers</h1>
        <p class="text-muted mb-2">View, add, edit, and delete teacher records.</p>
      </div>
    </div>

    <!-- background image -->
    <img src="images/backgrounds/team-bg.png" alt="team-bg" class="img-fluid team-bg">

    <!-- background shapes -->
    <img class="team-bg-shape-1 up-down-animation" src="images/background-shape/seo-ball-1.png" alt="background-shape">
    <img class="team-bg-shape-2 left-right-animation" src="images/background-shape/seo-ball-1.png"
      alt="background-shape">
    <img class="team-bg-shape-3 left-right-animation" src="images/background-shape/team-bg-triangle.png"
      alt="background-shape">
    <img class="team-bg-shape-4 up-down-animation img-fluid" src="images/background-shape/team-bg-dots.png"
      alt="background-shape">
  </section>

  <!-- Teachers Management Section -->
  <div class="container mt-5 mb-5">
    <div class="row mb-4">
      <div class="col-md-12 d-flex justify-content-between align-items-center">
        <h3>Teachers List</h3>
        <button class="btn btn-primary" data-toggle="modal" data-target="#addTeacherModal">
          <i class="ti-plus"></i> Add New Teacher
        </button>
      </div>
    </div>

    <!-- Search and Filter -->
    <div class="row mb-4">
      <div class="col-md-6">
        <input type="text" class="form-control" id="searchTeacher" placeholder="Search teachers by name or email...">
      </div>
      <div class="col-md-3">
        <select class="form-control" id="filterDepartment">
          <option value="">All Departments</option>
          <option value="Computer Science">Computer Science</option>
          <option value="Data Science">Data Science</option>
          <option value="Design">Design</option>
          <option value="Cloud Computing">Cloud Computing</option>
          <option value="Mobile Development">Mobile Development</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-secondary w-100" onclick="clearFilters()">Clear Filters</button>
      </div>
    </div>

    <!-- Teachers Table -->
    <div class="card shadow-lg border-0">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Department</th>
                <th>Specialization</th>
                <th>Join Date</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="teachersTableBody">
              <!-- Teachers will be loaded here -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Teacher Modal -->
  <div class="modal fade" id="addTeacherModal" tabindex="-1" aria-labelledby="addTeacherModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="addTeacherModalLabel">Add New Teacher</h5>
          <button type="button" class="close" data-dismiss="modal" aria-label="Close">
            <span aria-hidden="true">&times;</span>
          </button>
        </div>
        <div class="modal-body">
          <form id="teacherForm">
            <input type="hidden" id="teacherId">
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Name</label>
                <input type="text" class="form-control" id="teacherName" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" id="teacherEmail" required>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Phone</label>
                <input type="tel" class="form-control" id="teacherPhone" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Department</label>
                <select class="form-control" id="teacherDepartment" required>
                  <option value="Computer Science">Computer Science</option>
                  <option value="Data Science">Data Science</option>
                  <option value="Design">Design</option>
                  <option value="Cloud Computing">Cloud Computing</option>
                  <option value="Mobile Development">Mobile Development</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Specialization</label>
              <input type="text" class="form-control" id="teacherSpecialization" required>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">Join Date</label>
                <input type="date" class="form-control" id="teacherJoinDate" required>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">Status</label>
                <select class="form-control" id="teacherStatus" required>
                  <option value="Active">Active</option>
                  <option value="Inactive">Inactive</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">Courses (comma separated)</label>
              <input type="text" class="form-control" id="teacherCourses" placeholder="e.g., Web Development, Full Stack Development">
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="saveTeacher()">Save Teacher</button>
        </div>
      </div>
    </div>
  </div>

  <!-- jQuery -->
  <script src="plugins/jQuery/jquery.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="plugins/bootstrap/bootstrap.min.js"></script>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <!-- API Client -->
  <script src="../static/js/api.js"></script>
  <!-- Admin Manager -->
  <script src="../static/js/admin.js"></script>
  <!-- Admin Teachers Manager -->
  <script src="../static/js/admin-teachers.js"></script>
  <script>
    // Logout function
    async function logout() {
      await adminManager.logout();
    }
  </script>

</body>

</html>
