 <!DOCTYPE html>
<html lang="zxx">

<head>
  <meta charset="utf-8">
  <title>Lecture flow</title>

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <!-- theme meta -->
  <meta name="Lecture flow" content="Lecture flow" />

  <!-- ** Plugins Needed for the Project ** -->
  <!-- Bootstrap -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <!-- themefy-icon -->
  <link rel="stylesheet" href="plugins/themify-icons/themify-icons.css">
  <!-- slick slider -->
  <link rel="stylesheet" href="plugins/slick/slick.css">
  <!-- venobox popup -->
  <link rel="stylesheet" href="plugins/Venobox/venobox.css">
  <!-- aos -->
  <link rel="stylesheet" href="plugins/aos/aos.css">

  <!-- Main Stylesheet -->
  <link href="css/style.css" rel="stylesheet">

  <!--Favicon-->

  <link rel="icon" type="image/png" sizes="32x32" href="images/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon.png">

</head>


<body>

  <!-- navigation -->
  <section class="fixed-top navigation">
    <div class="container">
      <nav class="navbar navbar-expand-lg navbar-light" role="navigation">
        <a class="navbar-brand" href="index.html">
          <h3> Lecture flow </h3>
        </a>
       
        
          <div class="ml-auto d-flex">
            <h4 style="margin-top: 100;color:mediumspringgreen;">Well come @abc</h4>
            <a href="login .html" class="btn btn-primary ml-lg-3 primary-shadow">Logout</a>
          </div>
        </div>
      </nav>
    </div>
  </section>
  <!-- team -->
  <section class="section-lg team" id="team">
    <div class="container-fluid">
      
        <div class="col-lg-12 text-center">
          <h2 class="section-title" style="font-family:'Courier New', Courier, monospace;">Mark Attendance</h2>
          
        </div>
      </div>
      
        
         <!-- backgound image -->
    <img src="images/backgrounds/team-bg.png" alt="team-bg" class="img-fluid team-bg">
    <!-- background shapes -->
    <img class="team-bg-shape-1 up-down-animation" src="images/background-shape/seo-ball-1.png" alt="background-shape">
    <img class="team-bg-shape-2 left-right-animation" src="images/background-shape/seo-ball-1.png"
      alt="background-shape">
    <img class="team-bg-shape-3 left-right-animation" src="images/background-shape/team-bg-triangle.png"
      alt="background-shape">
    <img class="team-bg-shape-4 up-down-animation img-fluid" src="images/background-shape/team-bg-dots.png"
      alt="background-shape">
         
          
          <!--atandance-->
          

     
   
   <div class="container">
		<h1>Mark Attendance for {{ course.name }}</h1>
		<form method="post">
			<table class="table">
				<thead>
					<tr>
						<th>Name</th>
						<th>Attendance</th>
					</tr>
				</thead>
				<tbody>
					{% for user in users %}
					{% if user.roles=='student' %}
					<tr>
						<td>{{ user.username }}</td>
						<td>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="{{ user.id }}" value="present">
								<label class="form-check-label">Present</label>
							</div>
							<div class="form-check">
								<input class="form-check-input" type="radio" name="{{ user.id }}" value="absent">
								<label class="form-check-label">Absent</label>
							</div>
						</td>
					</tr>
					{% endif %}
					{% endfor %}
				</tbody>
			</table>
			<button type="submit" class="btn btn-primary">Submit</button>
		</form>
	</div>
	<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
	<script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

          <!--/atandance-->

  
  

  <!-- jQuery -->
  <script src="plugins/jQuery/jquery.min.js"></script>
  <!-- Bootstrap JS -->
  <script src="plugins/bootstrap/bootstrap.min.js"></script>
  <!-- slick slider -->
  <script src="plugins/slick/slick.min.js"></script>
  <!-- venobox -->
  <script src="plugins/Venobox/venobox.min.js"></script>
  <!-- aos -->
  <script src="plugins/aos/aos.js"></script>
  <!-- Main Script -->
  <script src="js/script.js"></script>

</body>

</html>
