<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lecture Flow - Lecture-to-Notes</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: Arial, sans-serif; background-color: #f8f9fa; }
        .notes-card { margin-bottom: 20px; }
        .generated-notes { background-color: #e9ecef; padding: 15px; border-radius: 5px; min-height: 200px; }
        .customize-options { margin-top: 15px; }
        .progress { height: 10px; }
        .highlight { background-color: #fff3cd; }
        .note-item { padding: 10px; border: 1px solid #ddd; margin-bottom: 5px; border-radius: 5px; }
        .note-item:hover { background-color: #e9ecef; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1 class="text-center mb-4">Lecture-to-Notes - Lecture Flow</h1>
        
        <!-- Input Lecture Content -->
        <div class="card notes-card">
            <div class="card-header">
                <h5>Input Lecture Content</h5>
            </div>
            <div class="card-body">
                <textarea class="form-control" id="lectureInput" rows="5" placeholder="Paste transcription text here, or type your lecture content..."></textarea>
                <p class="mt-2 text-muted">Or upload a file: <input type="file" class="form-control mt-2" id="lectureFile" accept=".txt,.docx"></p>
                <button class="btn btn-primary mt-3" id="generateBtn" onclick="generateNotes()">Generate Notes</button>
                <div class="progress mt-3" id="notesProgress" style="display: none;">
                    <div class="progress-bar bg-success" role="progressbar" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <!-- Saved Notes -->
        <div class="card">
            <div class="card-header">
                <h5>Saved Notes</h5>
            </div>
            <div class="card-body">
                <div id="notesList">
                    <p class="text-muted">Loading notes...</p>
                </div>
            </div>
        </div>

        <!-- Generated Notes Display -->
        <div class="card" id="notesCard" style="display: none;">
            <div class="card-header">
                <h5>Generated Notes</h5>
            </div>
            <div class="card-body">
                <div class="generated-notes" id="notesContent" contenteditable="false">
                    <!-- Notes will appear here -->
                </div>
                <div class="customize-options">
                    <button class="btn btn-secondary" onclick="toggleEdit()">Edit Notes</button>
                    <button class="btn btn-success ms-2" onclick="saveNotes()">Save Notes</button>
                    <button class="btn btn-info ms-2" onclick="highlightConcepts()">Highlight Key Concepts</button>
                    <button class="btn btn-warning ms-2" onclick="exportNotes()">Export as Text</button>
                    <div class="mt-3">
                        <label>Format:</label>
                        <select id="formatSelect" class="form-select d-inline-block w-auto ms-2" onchange="changeFormat()">
                            <option value="bullets">Bullet Points</option>
                            <option value="numbered">Numbered List</option>
                            <option value="paragraph">Paragraph</option>
                        </select>
                        <label class="ms-3">Theme:</label>
                        <select id="themeSelect" class="form-select d-inline-block w-auto ms-2" onchange="changeTheme()">
                            <option value="light">Light</option>
                            <option value="dark">Dark</option>
                        </select>
                    </div>
                </div>
            </div>
        </div>

        <!-- Gamification/Progress -->
        <div class="alert alert-success mt-4" id="progressAlert" style="display: none;">
            <strong>Progress Update:</strong> You've generated a new set of notes! Keep learning!
        </div>

        <!-- Accessibility Note -->
        <div class="alert alert-info mt-2">
            <strong>Accessibility:</strong> Edit notes for personalization. Export for offline use.
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../static/js/api.js"></script>
    <script>
        let notes = [];
        let currentNotesContent = '';

        // Check authentication and load notes on page load
        window.onload = async function() {
            const userId = sessionStorage.getItem('userId');
            const userRole = sessionStorage.getItem('userRole');
            
            if (!userId || !userRole) {
                alert('Please login first');
                window.location.href = 'login .html';
                return;
            }

            await loadNotes();

            // Handle file upload
            document.getElementById('lectureFile').addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = function(e) {
                        document.getElementById('lectureInput').value = e.target.result;
                    };
                    reader.readAsText(file);
                }
            });
        };

        // Load notes from API
        async function loadNotes() {
            try {
                const response = await api.getStudentNotes();
                
                if (Array.isArray(response)) {
                    notes = response;
                    displayNotes(notes);
                } else {
                    document.getElementById('notesList').innerHTML = '<p class="text-muted">No notes found.</p>';
                }
            } catch (error) {
                console.error('Error loading notes:', error);
                document.getElementById('notesList').innerHTML = '<p class="text-danger">Error loading notes. Please refresh the page.</p>';
            }
        }

        // Display notes
        function displayNotes(notesList) {
            const container = document.getElementById('notesList');
            
            if (!notesList || notesList.length === 0) {
                container.innerHTML = '<p class="text-muted">No notes found. Generate notes to create your first set!</p>';
                return;
            }

            container.innerHTML = notesList.map(note => {
                const date = new Date(note.created_at).toLocaleDateString();
                const preview = note.content ? 
                    note.content.substring(0, 100).replace(/<[^>]*>/g, '') + (note.content.length > 100 ? '...' : '') : 
                    'No content';
                return `
                    <div class="note-item">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <strong>${note.title || 'Untitled Notes'}</strong>
                                <p class="mb-0 text-muted"><small>${preview}</small></p>
                                <p class="mb-0 text-muted"><small>Created: ${date}</small></p>
                            </div>
                            <div>
                                <button class="btn btn-sm btn-primary" onclick="viewNote(${note.id})">View</button>
                                <button class="btn btn-sm btn-danger" onclick="deleteNote(${note.id})">Delete</button>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // View Note
        async function viewNote(noteId) {
            const note = notes.find(n => n.id === noteId);
            if (!note) {
                alert('Note not found');
                return;
            }

            currentNotesContent = note.content || '';
            document.getElementById('notesContent').innerHTML = note.content || 'No content';
            document.getElementById('notesCard').style.display = 'block';
        }

        // Generate Notes
        async function generateNotes() {
            const inputText = document.getElementById('lectureInput').value.trim();
            if (!inputText) {
                alert('Please enter or load lecture content first.');
                return;
            }

            // Show progress
            document.getElementById('notesProgress').style.display = 'block';
            let progress = 0;
            const interval = setInterval(() => {
                progress += 25;
                if (progress > 90) progress = 90;
                document.querySelector('#notesProgress .progress-bar').style.width = `${progress}%`;
            }, 500);

            try {
                // Simulate AI processing (placeholder until AI is integrated)
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Generate notes (placeholder - will be replaced with AI in the future)
                const generatedNotes = simulateAINotes(inputText);
                currentNotesContent = generatedNotes;
                document.getElementById('notesContent').innerHTML = generatedNotes;
                document.getElementById('notesCard').style.display = 'block';
                document.getElementById('progressAlert').style.display = 'block';

                clearInterval(interval);
                document.querySelector('#notesProgress .progress-bar').style.width = '100%';
                setTimeout(() => {
                    document.getElementById('notesProgress').style.display = 'none';
                }, 500);
            } catch (error) {
                console.error('Error generating notes:', error);
                alert('Error generating notes: ' + error.message);
                clearInterval(interval);
                document.getElementById('notesProgress').style.display = 'none';
            }
        }

        // Simulate AI Notes Generation (placeholder)
        function simulateAINotes(text) {
            // Basic keyword extraction and structuring (simulated AI)
            const sentences = text.split(/[.!?]+/).filter(s => s.trim().length > 0);
            const summary = sentences.slice(0, 2).join('. ') + '.';
            
            let bullets = '<ul>';
            sentences.slice(2, 5).forEach(sentence => {
                const trimmed = sentence.trim();
                if (trimmed.length > 0) {
                    bullets += `<li>${trimmed}</li>`;
                }
            });
            bullets += '</ul>';

            return `
                <h6>Summary</h6>
                <p>${summary}</p>
                <h6>Key Points</h6>
                ${bullets}
                <p class="text-muted mt-3"><small>Note: This is a simulated AI-generated summary. Real AI note generation will be integrated in the future.</small></p>
            `;
        }

        // Save Notes
        async function saveNotes() {
            const content = document.getElementById('notesContent').innerHTML;
            const title = prompt('Enter a title for these notes:', 'Untitled Notes') || 'Untitled Notes';
            
            if (!content || content.trim() === '') {
                alert('No notes content to save');
                return;
            }

            try {
                const result = await api.createNote({
                    title: title,
                    content: content
                });

                if (result.success) {
                    alert('Notes saved successfully!');
                    await loadNotes();
                    document.getElementById('notesCard').style.display = 'none';
                    document.getElementById('lectureInput').value = '';
                    document.getElementById('progressAlert').style.display = 'none';
                } else {
                    alert('Failed to save notes: ' + result.message);
                }
            } catch (error) {
                console.error('Error saving notes:', error);
                alert('Error saving notes: ' + error.message);
            }
        }

        // Delete Note
        async function deleteNote(noteId) {
            if (!confirm('Are you sure you want to delete this note?')) {
                return;
            }

            try {
                const result = await api.deleteNote(noteId);
                if (result.success) {
                    alert('Note deleted successfully');
                    await loadNotes();
                } else {
                    alert('Failed to delete note: ' + result.message);
                }
            } catch (error) {
                console.error('Error deleting note:', error);
                alert('Error deleting note: ' + error.message);
            }
        }

        // Toggle Edit Mode
        function toggleEdit() {
            const notesDiv = document.getElementById('notesContent');
            notesDiv.contentEditable = notesDiv.contentEditable === 'true' ? 'false' : 'true';
            if (notesDiv.contentEditable === 'true') {
                notesDiv.focus();
            }
        }

        // Highlight Key Concepts
        function highlightConcepts() {
            const notesDiv = document.getElementById('notesContent');
            const text = notesDiv.innerHTML;
            const keywords = ['AI', 'education', 'machine learning', 'engagement', 'applications', 'learning', 'student', 'teacher'];
            let highlighted = text;
            keywords.forEach(keyword => {
                const regex = new RegExp(`\\b(${keyword})\\b`, 'gi');
                highlighted = highlighted.replace(regex, '<span class="highlight">$1</span>');
            });
            notesDiv.innerHTML = highlighted;
        }

        // Change Format
        function changeFormat() {
            const format = document.getElementById('formatSelect').value;
            const notesDiv = document.getElementById('notesContent');
            let content = notesDiv.innerHTML;
            
            if (format === 'numbered') {
                content = content.replace(/<ul>/g, '<ol>').replace(/<\/ul>/g, '</ol>');
            } else if (format === 'paragraph') {
                content = content.replace(/<ul>.*?<\/ul>/gs, '<p>Converted to paragraph format for readability.</p>');
            } else {
                content = content.replace(/<ol>/g, '<ul>').replace(/<\/ol>/g, '</ul>');
            }
            notesDiv.innerHTML = content;
        }

        // Change Theme
        function changeTheme() {
            const theme = document.getElementById('themeSelect').value;
            const notesDiv = document.getElementById('notesContent');
            if (theme === 'dark') {
                notesDiv.style.backgroundColor = '#343a40';
                notesDiv.style.color = '#ffffff';
            } else {
                notesDiv.style.backgroundColor = '#e9ecef';
                notesDiv.style.color = '#000000';
            }
        }

        // Export Notes
        function exportNotes() {
            const content = document.getElementById('notesContent').textContent;
            if (!content) {
                alert('No notes to export');
                return;
            }

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `notes_${new Date().toISOString().split('T')[0]}.txt`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
