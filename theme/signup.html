<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Lecture flow</title>

  <!-- mobile responsive meta -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">

  <!-- theme meta -->
  <meta name="Lecture flow" content="Lecture flow" />

  <!-- ** Plugins Needed for the Project ** -->
  <!-- Bootstrap -->
  <link rel="stylesheet" href="plugins/bootstrap/bootstrap.min.css">
  <!-- themefy-icon -->
  <link rel="stylesheet" href="plugins/themify-icons/themify-icons.css">
  <!-- slick slider -->
  <link rel="stylesheet" href="plugins/slick/slick.css">
  <!-- venobox popup -->
  <link rel="stylesheet" href="plugins/Venobox/venobox.css">
  <!-- aos -->
  <link rel="stylesheet" href="plugins/aos/aos.css">

  <!-- Main Stylesheet -->
  <link href="css/style.css" rel="stylesheet">

  <!--Favicon-->

  <link rel="icon" type="image/png" sizes="32x32" href="images/icon.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/icon.png">

</head>

<body class="bg-light d-flex align-items-center justify-content-center mt-3" style="min-height: 80vh;">
  <!-- background images -->
  <img src="images/backgrounds/team-bg.png" alt="team-bg" class="img-fluid team-bg">
  <img class="team-bg-shape-1 up-down-animation" src="images/background-shape/seo-ball-1.png" alt="background-shape">
  <img class="team-bg-shape-2 left-right-animation" src="images/background-shape/seo-ball-1.png"
    alt="background-shape">
  <img class="team-bg-shape-3 left-right-animation" src="images/background-shape/team-bg-triangle.png"
    alt="background-shape">
  <img class="team-bg-shape-4 up-down-animation img-fluid" src="images/background-shape/team-bg-dots.png"
    alt="background-shape">

  <div class="card p-3 shadow" style="width: 100%; max-width: 380px; font-size: 0.9rem;">
    <h5 class="text-center text-primary mb-2 login-heading" style="font-size: 1.2rem;">Signup to Lecture Flow</h5>

    <form id="signupForm" action="/signup" method="POST" novalidate>
      <!-- Role selection -->
      <div class="d-flex justify-content-between role-select mb-2" style="font-size: 0.85rem;">
        <input type="radio" id="roleTeacher" name="role" value="teacher" required />
        <label for="roleTeacher">Teacher</label>
        <input type="radio" id="roleStudent" name="role" value="student" />
        <label for="roleStudent">Student</label>
      </div>

      <!-- Teacher code (hidden initially) -->
      <!-- <div class="mb-2" id="teacherCodeField" style="display: none;">
        <label class="form-label">Teacher Verification Code</label>
        <input type="text" class="form-control form-control-sm" name="teacherCode"
          placeholder="Enter teacher code if you're a teacher">
      </div> -->

      <div class="mb-2">
        <label for="username" class="form-label">Username</label>
        <input type="text" class="form-control form-control-sm" id="username" name="username" required
          placeholder="Your username">
        <div class="invalid-feedback">Please enter a username.</div>
      </div>

      <div class="mb-2">
        <label for="email" class="form-label">Email address</label>
        <input type="email" class="form-control form-control-sm" id="email" name="email" required
          placeholder="name@example.com">
        <div class="invalid-feedback">Please enter a valid email.</div>
      </div>

      <div class="mb-2">
        <label for="password" class="form-label">Password</label>
        <input type="password" class="form-control form-control-sm" id="password" name="password" required
          placeholder="Password">
        <div class="invalid-feedback">Enter a password (min 6 characters).</div>
      </div>

      <div class="mb-2">
        <label for="confirmPassword" class="form-label">Confirm Password</label>
        <input type="password" class="form-control form-control-sm" id="confirmPassword" name="confirmPassword"
          required placeholder="Re-enter password">
        <div class="invalid-feedback" id="confirmPasswordFeedback">Passwords must match.</div>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-2" style="font-size: 0.85rem;">
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="rememberMe" />
          <label class="form-check-label" for="rememberMe">Remember me</label>
        </div>
      </div>

      <button type="submit" class="btn btn-sm btn-primary w-100">Signup</button>
      <p class="text-center mt-2 small">Already have an account? <a href="login .html">Login</a></p>
    </form>
  </div>

  <!-- Form Validation and Teacher Code JS -->
  <script>
    (() => {
      const form = document.getElementById('signupForm');
      const password = document.getElementById('password');
      const confirmPassword = document.getElementById('confirmPassword');
      const confirmFeedback = document.getElementById('confirmPasswordFeedback');

      // Password match validation
      function validatePasswords() {
        if (password.value !== confirmPassword.value) {
          confirmPassword.setCustomValidity("Passwords do not match");
          confirmFeedback.style.display = 'block';
        } else {
          confirmPassword.setCustomValidity("");
          confirmFeedback.style.display = 'none';
        }
      }

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        validatePasswords();
        
        if (!form.checkValidity()) {
          form.classList.add('was-validated');
          return;
        }

        const formData = {
          username: document.getElementById('username').value,
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
          role: document.querySelector('input[name="role"]:checked').value,
          phone: ''
        };

        try {
          const result = await api.signup(formData);
          
          if (result.success) {
            alert('Registration successful! Please login.');
            window.location.href = 'login .html';
          } else {
            alert(result.message || 'Registration failed. Please try again.');
          }
        } catch (error) {
          console.error('Signup error:', error);
          alert('An error occurred. Please try again.');
        }
      });

      password.addEventListener('input', validatePasswords);
      confirmPassword.addEventListener('input', validatePasswords);

      // Teacher code visibility
      const teacherRadio = document.getElementById('roleTeacher');
      const studentRadio = document.getElementById('roleStudent');
      const teacherCodeField = document.getElementById('teacherCodeField');

      teacherRadio.addEventListener('change', () => {
        teacherCodeField.style.display = 'block';
      });

      studentRadio.addEventListener('change', () => {
        teacherCodeField.style.display = 'none';
      });
    })();
  </script>

  <!-- Bootstrap Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <!-- Socket.IO -->
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <!-- API Client -->
  <script src="../static/js/api.js"></script>
</body>
</html>
